# ─────────────────────────────────────────────────────────────────────────
# 4. manifest gates.* 字段(12 个)
#    gate: manifest 字段名; setter: 置位者; blocks: 阻塞下游
# ─────────────────────────────────────────────────────────────────────────
gates:
  - gate: data_design
    setter: ioc-data-design
    blocks: [ads-design]
  - gate: ads_design_validation
    setter: ioc-ads-design-validate
    blocks: [sql-generate]            # = fail 时阻塞
  - gate: clouddevops_review
    setter: sdd-clouddevops-update
    blocks: [sql-bindings-ready]
  - gate: ads_clarification_applied
    setter: 澄清闭环回写
    blocks: [*]                       # P0 open 时阻塞各阶段
  - gate: service_design
    setter: ioc-service-design
    blocks: [service-develop, frontend-plan]
  - gate: service_develop
    setter: ioc-service-develop
    blocks: [frontend-plan]           # 条件
  - gate: sql_bindings_ready
    setter: sql-bindings-ready
    blocks: [sql-generate]
  - gate: sql_validation_static
    setter: sql-validator
    blocks: [job-create(TEST), platform-test]
  - gate: test_execution
    setter: platform-test
    blocks: [promotion]
  - gate: platform_test
    setter: platform-test
    blocks: [promotion]
  - gate: sql_promotion
    setter: promotion
    blocks: [archive]
  - gate: platform_formal
    setter: platform-formal
    blocks: [archive]                 # 建议 pass

# ─────────────────────────────────────────────────────────────────────────
# 5. validation(机器校验映射)
#    artifact → 结构校验器(harness/tools/validate_*.py)
# ─────────────────────────────────────────────────────────────────────────
validation:
  change-manifest.yaml:
    - validate_gate_change.py         # gates.* 变更校验(CORE-AX9)
    - validate_sdd_state.py           # manifest/evidence/artifacts 一致性
  feature-delta-indicator.md:
    - validate_lifecycle_columns.py   # 指标生命周期列定义(CORE-AX6)
    - validate_layer_consumption.py   # 语义层分层约束(KW-AX8)
  delta-design-ads.md:
    - validate_layer_consumption.py   # KW-AX8
    - validate_ads_table_design.py    # ADS 表设计
    - validate_indicator_ads_binding.py
  *-clarification-questions.md:
    - validate_ads_clarification.py   # AI 不得 closed P0(CORE-AX8)
    - validate_data_design_clarification.py
    - validate_subject_clarification.py
  sql-source-bindings.yaml:
    - validate_sql_bindings.py
    - validate_layer_consumption.py   # KW-AX8
    - validate_domain_patterns.py     # KW-AX5
    - validate_area_source_consistency.py
  "hql_test/*_test.sql":
    - validate_sql_ddl.py             # DDL 结构
    - validate_sql_etl_patterns.py    # ETL 模式(KW-AX3)
    - validate_domain_patterns.py     # 领域模式(KW-AX5)
    - validate_sql_file_naming.py
    - validate_sql_column_refs.py     # 列引用(从 evidence)
  "hql/*.sql":
    - validate_sql_ddl.py
    - validate_sql_etl_patterns.py
    - validate_domain_patterns.py
    - validate_sql_file_naming.py
    - validate_sql_column_refs.py
  evidence/schema_*.json:
    - validate_evidence_provenance.py # 证据溯源
    - validate_tool_evidence.py       # 工具失败禁止落盘(CORE-AX10)
  evidence/etl-sql/*.sql:
    - validate_etl_lineage_evidence.py
    - validate_upstream_job_lineage.py

# ─────────────────────────────────────────────────────────────────────────
# 6. blocks_when 规则(机读)
#    stage: 阶段; gates: 需要置位的 manifest gate; min_level: 产物最低等级
# ─────────────────────────────────────────────────────────────────────────
blocks_when:
  - stage: ads-design
    requires_gates: [data_design]
  - stage: sql-generate
    requires_gates: [ads_design_validation, clouddevops_review, sql_bindings_ready]
  - stage: sql-bindings-ready
    requires_gates: [clouddevops_review]
  - stage: job-create
    requires_gates: [sql_validation_static]
    min_level: L2                    # validation-report 至少 L2
  - stage: promotion
    requires_gates: [test_execution, platform_test, sql_validation_static]
  - stage: archive
    requires_gates: [sql_promotion, platform_formal]
  - stage: service-develop
    requires_gates: [service_design]
  - stage: frontend-plan
    requires_gates: [service_design] # service_develop 条件触发
  - stage: "*"
    requires_gates: [ads_clarification_applied]  # P0 open 时全局阻塞
