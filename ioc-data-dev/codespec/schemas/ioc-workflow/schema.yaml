  - category: 数据治理/稽核
    count: 12
    ids:
      - audit-report-view
      - bigdata-knowledge-reverse
      - clarification-view
      - data-context-gather
      - data-table-update
      - data-validation
      - datav-lowcode
      - excel-table-schema-extractor
