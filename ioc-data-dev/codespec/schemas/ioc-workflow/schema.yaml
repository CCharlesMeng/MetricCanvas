# ioc-workflow schema — IOC 数据开发流程全量注册表
# 版本:1.0 · 2026-08-18
# 真源:本文档定义流程(artifacts DAG + skills 白名单 + validation + gates)。
# 修改须同步 codespec/guidelines/ioc-kernel/ 与 harness/stages/、harness/tools/。
schema: ioc-workflow
version: "1.0"

meta:
  name: IOC 数据开发工作流
  source: 《IOC 数据开发全流程与周边依赖》v1.0
  main_paths:
    data: 15 阶段
    subject: 13 阶段
  artifacts: 11 节点
  skills: 58 个(7 类)
  activities: 34 个

# ─────────────────────────────────────────────────────────────────────────
# 1. 主流程路径
# ─────────────────────────────────────────────────────────────────────────
main_paths:
  data_main_path: &data_path
    order: 1
    stages:
      - intake
      - requirement
      - data-design
      - ads-design
      - ads-design-validation
      - ads-clarification-apply
      - clouddevops-review
      - sql-bindings-ready
      - sql-generate
      - sql-validation
      - job-create            # TEST
      - platform-test
      - promotion
      - job-create            # FORMAL
      - platform-formal
      - archive
  subject_main_path: &subject_path
    order: 2
    stages:
      - requirement
      - subject-design
      - subject-design-validation
      - subject-clarification-apply
      - subject-sql-bindings-ready
      - sql-generate
      - sql-validation
      - job-create
      - platform-test
      - promotion
      - platform-formal
      - archive
  parallel_tracks: &parallel_tracks
    order: 3
    trigger_after: [ads-design-validation]
    tracks:
      service_track:
        - act.service-design
        - act.service-develop        # 条件触发
        - act.frontend-plan
      test_track:
        - act.test-analyzer
        - act.testpoint-analyzer
        - act.testcase-designer

# ─────────────────────────────────────────────────────────────────────────
# 2. artifacts DAG(11 个产物节点)
#    phase: 所属阶段; generates: 产物文件; requires: 前置产物
# ─────────────────────────────────────────────────────────────────────────
artifacts:
  - id: proposal-fe
    phase: prd
    generates: [proposal-fe.md]
    requires: []
    description: 需求澄清
  - id: feature-delta-spec
    phase: prd
    generates: [feature-delta-spec.md]
    requires: [proposal-fe]
    description: FE 级增量规格
  - id: feature-delta-acceptance
    phase: prd
    generates: [feature-delta-acceptance.md]
    requires: [feature-delta-spec]
    description: FE 级验收摘要
  - id: feature-delta-indicator
    phase: prd
    generates: [feature-delta-indicator.md]
    requires: [feature-delta-spec]
    description: 指标盘点 v0(后续 v1/v2/v3 回填,见 indicator-lifecycle)
  - id: gwt-acceptance
    phase: prd
    generates: [GWT验收.md]
    requires: [feature-delta-acceptance, feature-delta-indicator]
    description: GWT 全场景验收
  - id: delta-design-ads
    phase: design
    generates: [delta-design-ads.md]
    requires: [proposal-fe, feature-delta-spec, feature-delta-acceptance, feature-delta-indicator, gwt-acceptance]
    description: ADS 增量设计(ioc-ads-design 产出)
  - id: sql-test
    phase: sql
    generates: ["hql_test/*_test.sql"]
    requires: [delta-design-ads]
    description: 测试态 SQL(目标库 bi_test / cbc_test)
  - id: mock-data-plan
    phase: validation
    generates: [mock-data-plan.md]
    requires: [delta-design-ads, sql-test, gwt-acceptance]
    description: Mock 数据方案
  - id: validation-report
    phase: validation
    generates: [validation-report.md]
    requires: [mock-data-plan, sql-test]
    description: SQL 验证报告
  - id: sql-promotion
    phase: sql
    generates: ["hql/*.sql"]
    requires: [validation-report]
    description: 正式 SQL 脚本
  - id: archive
    phase: archive
    generates: [archive-summary.md, baseline-update.md]
    requires: [validation-report, sql-promotion]
    description: 归档 + knowledge-base 回写

# ─────────────────────────────────────────────────────────────────────────
# 3. skills 白名单(58 个,7 类)
#    仅白名单内 skill 可被调度;白名单外一律禁止。
# ─────────────────────────────────────────────────────────────────────────
skills:
  - category: 多仓 SDD 标准
    count: 19
    ids:
      - sdd-knowledge-index
      - sdd-reverse
      - sdd-standard-runtime
      - sdd-explore
      - sdd-ux-decode
      - sdd-style-reference
      - sdd-prd
      - sdd-design
      - sdd-frontend-design
      - sdd-requirement-review
      - sdd-create-us
      - sdd-task
      - sdd-dev
      - sdd-dev-subagent
      - sdd-review-story
      - sdd-review-feature
      - sdd-archive-workspace
      - sdd-evaluate-knowledge-consumption
      - sdd-issue-resolve
  - category: IOC 定制
    count: 11
    ids:
      - ioc-ads-design
      - ioc-ads-design-validate
      - ioc-data-design
      - ioc-data-plan
      - ioc-frontend-graphql
      - ioc-frontend-plan
      - ioc-service-design
      - ioc-service-develop
      - ioc-sketch-decode
      - ioc-subject-design
      - ioc-subject-design-validate
  - category: SDD 扩展
    count: 5
    ids:
      - sdd-init
