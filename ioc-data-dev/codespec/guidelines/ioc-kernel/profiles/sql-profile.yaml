# sql-profile.yaml — SQL 开发 Profile
# POL-SQL-* 的 Profile 化(按 DDL / ETL / Query 分组)

ddl:
  - POL-SQL-DDL-001  # ORC SerDe(hive;DLI 豁免)
  - POL-SQL-DDL-002  # 测试态目标库按 engine 分支(bi_test/cbc_test)
  - POL-SQL-DDL-005  # CREATE 前 DROP TABLE IF EXISTS
  - POL-SQL-DDL-006  # 字段顺序与设计文档一致
  - POL-SQL-DDL-007  # 分区表加列须 CASCADE
  - POL-SQL-DDL-009  # 测试态表名格式

etl:
  - POL-SQL-ETL-002  # CTE 须在 INSERT 之前
  - POL-SQL-ETL-003  # INSERT OVERWRITE 分区表须显式 PARTITION
  - POL-SQL-ETL-005  # active 列 NULL 用 COALESCE;reserved 恒 NULL
  - POL-SQL-ETL-006  # 率值分母为 0 时结果为 NULL
  - POL-SQL-ETL-007  # 先过滤→再 JOIN→再聚合
  - POL-SQL-ETL-009  # 聚合函数内部须先 COALESCE

query:
  - POL-SQL-QRY-001  # 表须有有意义别名,禁止 t1/t2
  - POL-SQL-QRY-002  # 引用字段必须带表别名
  - POL-SQL-QRY-005  # 禁止 SELECT *;嵌套不超过 3 层

engine_branches:      # POL-REV-PLATFORM-003
  hive:
    set_config: 从 hive-set-config.yaml 生成
    cdm_node: 需要
    orc_serde: 需要
    test_db: bi_test
    engine_field: 默认
  dli:
    set_config: 跳过(平台托管)
    cdm_node: 跳过
    orc_serde: 完全省略
    test_db: cbc_test
    engine_field: 须显式声明 engine: dli
