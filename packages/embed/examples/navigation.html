<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MetricCanvas URL 导航</title></head>
<body>
  <main id="dashboard"></main>
  <script src="/dist/metriccanvas-runtime.global.js"></script>
  <script type="module">
    try {
    await MetricCanvas.ready;
    // 内容服务在 /pages/<id> 返回此 HTML，在 /pages/<id>.json 返回页面资产。
    // 宿主只负责加载文档；没有 pageId 导航解析器或跳转回调。
    const url = new URL(location.href);
    const id = url.pathname.startsWith('/pages/')
      ? decodeURIComponent(url.pathname.slice('/pages/'.length))
      : url.searchParams.get('page') ?? 'ioc-project-overview';
    const response = await fetch(`/pages/${encodeURIComponent(id)}.json`);
    if (!response.ok) throw new Error(`页面加载失败: ${response.status}`);
    window.pageDocument = await response.json();
    window.queryEvents = [];
    // query 数据源要真往返：内容服务在 DQE 默认端点上同源提供数据，
    // 宿主注入真实网关，不写死路径。
    window.dataGateway = MetricCanvas.createDqeGateway();
    // Only these synthetic acceptance pages use the local V2 fixture Adapter.
    if(window.pageDocument.iocHeader?.filterIds?.includes('region')||id==='ioc-header-calendar-window-demo')window.dataGateway.fetchFilterCandidates=async(request,{signal})=>{
      const response=await fetch('/__fixtures/filter-candidates',{method:'POST',headers:{'Content-Type':'application/json','x-ioc-region-values':window.pageDocument.filters?.find(filter=>filter.id==='region')?.hierarchy?.some(level=>level.dimension.endsWith('-name'))?'names':'codes','x-ioc-region-geo':window.pageDocument.filters?.find(filter=>filter.id==='region')?.hierarchy?.some(level=>level.id==='geo')?'yes':'no'},body:JSON.stringify(request),signal});
      if(!response.ok)throw new Error('本地候选服务不可用');return response.json();
    };
    let sharedBridge;
    const sharedBindings={'key-office':'key-office',region:'region',mtime:'mtime'};
    if(['key-office-filter-demo','key-office-filter-target','key-office-priority-demo','key-office-priority-target'].includes(id)){
      const fixture=await import('/__fixtures/key-office-filter.js');
      let saved={};try{saved=JSON.parse(sessionStorage.getItem('mc-key-office-demo')??'{}');}catch{}
      sharedBridge=fixture.createSharedFilterBridge(saved);
      window.keyOfficeRequests=[];
      window.dataGateway=(id.startsWith('key-office-priority-')?fixture.createKeyOfficePriorityGateway:fixture.createKeyOfficeGateway)((kind,request)=>window.keyOfficeRequests.push({kind,request}),new URLSearchParams(location.search).get('state')??'ready');
    }
    if(window.pageDocument.iocHeader){
      const fixture=await import('/__fixtures/key-office-filter.js');
      window.pageDocument=await fixture.prepareIocHeaderFilters(window.pageDocument,window.dataGateway,{signal:new AbortController().signal});
    }
    const publicInputs=sharedBridge?MetricCanvas.projectNavigationInputs(window.pageDocument):{filters:[]};
    const initialSearch=sharedBridge?.initialSearch(publicInputs,location.search,sharedBindings)??location.search;
    function recordShared(search){if(!sharedBridge)return;sharedBridge.recordSearch(publicInputs,search,sharedBindings);sessionStorage.setItem('mc-key-office-demo',JSON.stringify(sharedBridge.snapshot()));}
    recordShared(initialSearch);
    const temporal=['ioc-header-availability-demo','ioc-header-calendar-window-demo'].includes(id);
    if(temporal){const fixture=await import('/examples/ioc-time-inputs.mjs');window.displayInputs=fixture.createTimeInputs();fixture.timeInputsPanel(window.displayInputs,()=>{window.runtime.destroy();mountPage();});}
    function mountPage(){window.runtime = MetricCanvas.mount('#dashboard', {
      document: window.pageDocument,
      displayInputs:window.displayInputs,
      dataGateway: window.dataGateway,
      initialSearch,
      navigation:{async resolveTargetInputs(href,{signal}){
        const target=new URL(href,document.baseURI),match=/^\/pages\/([^/]+)$/.exec(target.pathname);
        if(target.origin!==location.origin||!match)return undefined;
        const response=await fetch(`/pages/${encodeURIComponent(decodeURIComponent(match[1]))}.json`,{signal});
        if(!response.ok)return undefined;return MetricCanvas.projectNavigationInputs(await response.json());
      }},
      onEvent(event) {
        window.queryEvents.push(event);
        if (event.type === 'filter-change' || event.type === 'tab-change') {
          recordShared(event.search);
          const current = new URL(location.href);
          current.search = event.search;
          history.replaceState(null, '', current);
          // 不原样回灌 update，真实切页由浏览器加载完整输入。
        }
      }
    });}
    mountPage();
    } catch (error) {
      const heading=document.createElement('h1'),message=document.createElement('p');
      heading.textContent='页面加载失败';
      message.textContent=error instanceof Error?error.message:String(error);
      document.querySelector('#dashboard').replaceChildren(heading,message);
    }
  </script>
</body>
</html>
