<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetricCanvas query 嵌入示例</title>
    <style>
      body { margin: 0; padding: 24px; background: #f4f4f5; }
      #dashboard { max-width: 1200px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="dashboard"></div>
    <script src="../dist/metriccanvas-runtime.global.js"></script>
    <script>
      const rows = [
        { region: '华东', gmv: 386000 },
        { region: '华南', gmv: 271000 }
      ];
      const dataGateway = {
        async fetchData(query) {
          const region = query.filterValues.find(
            filter =>
              filter.target === 'dimension' &&
              filter.queryField === '区域'
          );
          const selected = region ? new Set(region.values.map(String)) : null;
          return selected ? rows.filter(row => selected.has(row.region)) : rows;
        },
        async fetchDimensionValues() {
          return rows.map(row => row.region);
        }
      };
      const pageDocument = {
        schemaVersion: '3.0',
        id: 'query-example',
        dataSources: {
          sales: {
            fields: {
              region: {
                queryField: '区域',
                type: 'string',
                role: 'dimension',
                nullable: false
              },
              gmv: {
                queryField: '成交总额',
                type: 'number',
                role: 'measure',
                defaultFormat: 'number-grouped',
                nullable: false
              }
            },
            source: {
              type: 'query',
              query: {
                language: 'dqe',
                body: {
                  dsl_list: [{
                    output_dims: ['区域'],
                    output_metrics: ['成交总额'],
                    filter: { dims: [], metrics: [] },
                    order: {}
                  }]
                },
                filterBindings: {
                  'region-filter': {
                    target: 'dimension',
                    queryField: '区域'
                  }
                }
              }
            }
          }
        },
        filters: [{
          id: 'region-filter',
          type: 'dimension',
          dimension: 'region',
          label: '区域'
        }],
        sections: [{
          id: 'main',
          layout: { type: 'grid', columns: 12 },
          components: [{
            id: 'sales-table',
            type: 'table',
            layout: { span: 12 },
            data: { main: 'sales' },
            props: {
              title: '区域成交额',
              columns: [
                { field: 'region' },
                {
                  field: {
                    data: 'main',
                    field: 'gmv',
                    format: 'number-grouped'
                  }
                }
              ]
            }
          }]
        }]
      };

      window.queryPageDocument = pageDocument;
      window.queryDataGateway = dataGateway;
      window.queryEvents = [];
      window.queryRuntime = MetricCanvas.mount('#dashboard', {
        document: pageDocument,
        dataGateway,
        onEvent(event) {
          window.queryEvents.push(event);
        }
      });
    </script>
  </body>
</html>
