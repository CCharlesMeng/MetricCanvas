<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Embed URL 参数</title></head>
<body style="margin:0"><div id="dashboard"></div>
<script type="module">
  import {mount} from '../dist/metriccanvas-runtime.es.js';
  const response = await fetch('/pages/embed-url-params.json');
  const document = await response.json();
  window.runtime = mount('#dashboard', {document});
</script>
</body></html>
