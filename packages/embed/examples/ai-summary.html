<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetricCanvas AI 总结嵌入示例</title>
  </head>
  <body>
    <div id="dashboard"></div>
    <script src="../dist/metriccanvas-runtime.global.js"></script>
    <script>
      window.aiSummaryRequests = [];
      const generate = async (question, contextInfo) => {
        window.aiSummaryRequests.push({ question, contextInfo });
        await new Promise(resolve => setTimeout(resolve, 150));
        return '<p><strong>整体风险</strong>：华东代表处有 3 个未考察客户。</p>';
      };

      window.aiSummaryRuntime = MetricCanvas.mount('#dashboard', {
        document: {
          schemaVersion: '6.11', layout: 'report',
          id: 'ai-summary-example',
          dataSources: {
            risks: {
              fields: {
                office: { type: 'string', role: 'dimension' },
                missing: { type: 'number', role: 'measure' },
                secret: { type: 'string', role: 'dimension' }
              },
              source: {
                type: 'inline',
                rows: [{ office: '华东', missing: 3, secret: '不得外传' }]
              }
            }
          },
          sections: [{
            id: 'risk',
            components: [{
              id: 'risk-summary',
              type: 'aiSummary',
              layout: { span: 12 },
              props: {
                title: '风险总结',
                promptTemplate: '只使用输入数据总结。',
                relatedData: {
                  risk: {
                    source: 'risks',
                    description: '各代表处风险数据',
                    fields: [
                      { field: 'office', term: '代表处' },
                      { field: 'missing', term: '未考察数' }
                    ]
                  }
                }
              }
            }]
          }]
        },
        aiSummary: { generate }
      });
    </script>
  </body>
</html>
