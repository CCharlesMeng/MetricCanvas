# CI 流水线(切片9,docs/solution.md §5「页面即代码」):
# PR 与 main push 触发,校验不过则 workflow 失败、阻止合并(分支保护规则由维护者在仓库设置里开启)。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metriccanvas-authoring/tool/requirements.lock

      # allowBuilds(esbuild)已在 pnpm-workspace.yaml 声明,frozen-lockfile 下自动生效
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装创作 Bundle 依赖
        run: python -m pip install --require-hashes -r metriccanvas-authoring/tool/requirements.lock

      # 校验页面文档(结构 + 语义 + 文件名)。失败时按错误分型汇总到 job summary:
      # v3 页面文档只做结构与绑定契约校验；DQE 查询错误在预览/运行阶段返回。
      - name: 校验页面文档
        run: |
          set +e
          pnpm validate 2>&1 | tee validate.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '## 页面文档校验失败'
              if grep -q 'SCHEMA_ERROR' validate.log; then
                echo '- **SCHEMA_ERROR**:页面文档不符合 v3 契约，修改文档本身即可；v1/v2 页面需在接入仓库前离线转换（错误明细见「校验页面文档」步骤日志）。'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: 检查创作 Bundle 中立契约
        run: pnpm authoring:contracts:check

      - name: 验证创作 Bundle
        run: pnpm authoring:check

      - name: 单元测试
        run: pnpm test

      - name: 类型检查
        run: pnpm check

      # 静态构建(SvelteKit adapter-static,SPA fallback)。索引页由运行时经构建期
      # glob 收录的全部 pages/*.json 动态列出,新增看板无需手工登记。
      - name: 静态构建
        run: pnpm build

      # 部署载体(公司内网)待定,先以 artifact 形式交付构建产物;
      # 确定载体后再接 deploy-pages 或内网发布流程。
      - name: 上传静态构建产物
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: canvas-static
          path: apps/canvas/build

      - name: 上传创作 Bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: metriccanvas-authoring-${{ github.sha }}
          path: metriccanvas-authoring
