# CI 流水线(切片9,docs/solution.md §5「页面即代码」):
# PR 与 main push 触发,校验不过则 workflow 失败、阻止合并(分支保护规则由维护者在仓库设置里开启)。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metriccanvas-authoring/tool/requirements.lock

      # allowBuilds(esbuild)已在 pnpm-workspace.yaml 声明,frozen-lockfile 下自动生效
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装创作 Bundle 依赖
        run: python -m pip install --require-hashes -r metriccanvas-authoring/tool/requirements.lock

      # 校验页面文档(结构 + 语义 + 文件名)。失败时按错误分型汇总到 job summary:
      # v3 页面文档只做结构与绑定契约校验；DQE 查询错误在预览/运行阶段返回。
      - name: 校验页面文档
        run: |
          set +e
          pnpm validate 2>&1 | tee validate.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '## 页面文档校验失败'
              if grep -q 'SCHEMA_ERROR' validate.log; then
                echo '- **SCHEMA_ERROR**:页面文档不符合 v3 契约，修改文档本身即可；v1/v2 页面需在接入仓库前离线转换（错误明细见「校验页面文档」步骤日志）。'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: 检查创作 Bundle 中立契约
        run: pnpm authoring:contracts:check

      - name: 验证创作 Bundle
        run: pnpm authoring:check

      - name: 单元测试
        run: pnpm test

      - name: 类型检查
        run: pnpm check

      # 静态构建(SvelteKit adapter-static,SPA fallback)。索引页由运行时经构建期
      # glob 收录的全部 pages/*.json 动态列出,新增看板无需手工登记。
      - name: 静态构建
        run: pnpm build

      # 部署载体(公司内网)待定,先以 artifact 形式交付构建产物;
      # 确定载体后再接 deploy-pages 或内网发布流程。
      - name: 上传静态构建产物
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: canvas-static
          path: apps/canvas/build

      - name: 上传创作 Bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: metriccanvas-authoring-${{ github.sha }}
          path: metriccanvas-authoring

  # Java 页面资产 module 组（ADR-0062）：独立 job，先跑 GitHub Actions，CloudBuild 接入随宿主流程。
  # 这里用本地占位 parent 与 Maven Central；公司 CI 上先执行 scripts/use-company-parent.sh。
  # 嵌入 JAR 的契约快照是否与 contracts/metriccanvas 一致、Interface YAML 副本是否漂移，由上面 job 的
  # authoring:contracts:check 守。手写 delegate/model 与 dfs-codegen 的漂移检查（scripts/check-codegen-drift.sh）
  # 需要内部 Artifactory，只在公司 CI 跑。
  java-page-assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metriccanvas-page-assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: metriccanvas-page-assets/**/pom.xml

      # 不用 Maven Wrapper（内网禁直连）；runner 自带系统 Maven。
      # runner 自带 Docker，MySqlPageStoreIntegrationTest 以 Testcontainers 起 mysql:8.0 实跑；
      # 没有 Docker 的环境（公司 CloudBuild 探针）该类会 skip，或用 PAGE_ASSETS_TEST_DB_URL 指向测试库。
      - name: 构建、单测、conformance、ArchUnit、MySQL 集成测试、SpotBugs
        run: mvn -B -ntp -Pgates verify

      # J4 真实纵切（ADR-0062）：Docker MySQL → 上一步的 tar.gz → Python Tool 真实 stdio MCP → Java 落库
      # → platform Java Adapter 读精确修订。Relay / DQE 用 Harness 替身，页面资产链路全部真实。
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metriccanvas-authoring/tool/requirements.lock
      - name: 纵切依赖（pnpm + 创作 Bundle）
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --require-hashes -r metriccanvas-authoring/tool/requirements.lock
      - name: 本地真实纵切 pnpm slice:page-assets
        working-directory: .
        env:
          METRICCANVAS_PYTHON: python
        run: pnpm slice:page-assets

      - name: 上传交付包
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: page-assets-bootstrap-${{ github.sha }}
          path: metriccanvas-page-assets/page-assets-bootstrap/target/*.tar.gz
