# All checks use the same GitHub SHA. The required "ci" status aggregates the per-change checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: 检查仓库卫生（单文件体积与证据目录）
        run: pnpm hygiene:check
      - name: 静态代码检查（Biome）
        run: pnpm lint
      - name: 检查设计事实结构
        run: pnpm design:facts:check
      - name: 检查新增循环与跨层依赖路径
        env:
          METRICCANVAS_ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$METRICCANVAS_ARCHITECTURE_BASE"
          pnpm architecture:check

  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metriccanvas-authoring/tool/requirements.lock

      - name: 安装创作 Bundle 依赖
        run: python -m pip install --require-hashes -r metriccanvas-authoring/tool/requirements.lock

      - name: 检查创作公共模块圈复杂度
        run: |
          python -m pip install radon==6.0.1
          python tools/scripts/check-authoring-complexity.py

      - name: 审计全项目平均圈复杂度与函数热点
        env:
          METRICCANVAS_COMPLEXITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$METRICCANVAS_COMPLEXITY_BASE"
          pnpm complexity:check

      # 校验页面文档(结构 + 语义 + 文件名)。失败时按错误分型汇总到 job summary:
      # 页面文档只做当前协议的结构与绑定契约校验；DQE 查询错误在预览/运行阶段返回。
      - name: 校验页面文档
        run: |
          set +e
          pnpm validate 2>&1 | tee validate.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '## 页面文档校验失败'
              if grep -q 'SCHEMA_ERROR' validate.log; then
                echo '- **SCHEMA_ERROR**:页面文档不符合当前产品契约；按错误路径检查文档，旧版本先运行独立升级工具（错误明细见「校验页面文档」步骤日志）。'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: 检查创作 Bundle 中立契约
        run: pnpm authoring:contracts:check

      - name: 检查创作 Skill 工具类型
        run: pnpm exec tsc --noEmit -p tools/tsconfig.skills.json

      - name: 检查 ADR 索引与主题速查表
        run: pnpm adr:index:check

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metriccanvas-authoring/tool/requirements.lock
      - name: 安装契约注册探查依赖
        run: python -m pip install --require-hashes -r metriccanvas-authoring/tool/requirements.lock
      - name: 运行常规回归
        run: >-
          pnpm test --maxWorkers=2 --shard=${{ matrix.shard }}/3
          --exclude tests/authoring-export-isolation.test.ts
          --exclude tests/authoring-temporal-evaluation.test.ts
          --exclude tests/skill-release.test.ts

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      # 产品构建包含四个引擎交付物与纯前端静态平台。
      - name: 产品构建
        run: pnpm build

      - name: 校验工作区包导出与构建产物
        run: pnpm packages:check

      - name: 严格校验 Embed 分发基线（每个 JS 原始体积不超过 1 MB）
        run: pnpm --filter @metriccanvas/embed check:dist

      - name: 安装 Embed 冒烟浏览器
        run: pnpm --filter @metriccanvas/embed exec playwright install --with-deps chrome

      - name: 验证 Embed 挂载和 ES/global 完整接入
        run: pnpm --filter @metriccanvas/embed exec playwright test mount-lifecycle.spec.ts distribution.spec.ts --workers=1

      - name: 验证 Embed 定稿月缓存与表格渐进渲染
        run: pnpm --filter @metriccanvas/embed exec playwright test finalization-progressive-table.spec.ts --workers=1

  ci:
    if: ${{ always() }}
    needs: [architecture, authoring, tests, types, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require all checks to succeed
        run: node tools/scripts/check-ci-results.mjs
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
