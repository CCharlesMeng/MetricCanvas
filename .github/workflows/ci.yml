# All checks use the same GitHub SHA. Required status "ci" aggregates every job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metriccanvas-authoring/tool/requirements.lock

      - name: 安装创作 Bundle 依赖
        run: python -m pip install --require-hashes -r metriccanvas-authoring/tool/requirements.lock

      - name: 检查创作公共模块圈复杂度
        run: |
          python -m pip install radon==6.0.1
          python tools/scripts/check-authoring-complexity.py

      - name: 审计全项目平均圈复杂度与函数热点
        run: pnpm complexity:check

      # 校验页面文档(结构 + 语义 + 文件名)。失败时按错误分型汇总到 job summary:
      # 页面文档只做当前协议的结构与绑定契约校验；DQE 查询错误在预览/运行阶段返回。
      - name: 校验页面文档
        run: |
          set +e
          pnpm validate 2>&1 | tee validate.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '## 页面文档校验失败'
              if grep -q 'SCHEMA_ERROR' validate.log; then
                echo '- **SCHEMA_ERROR**:页面文档不符合当前产品契约；按错误路径检查文档，旧版本先运行独立升级工具（错误明细见「校验页面文档」步骤日志）。'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: 检查创作 Bundle 中立契约
        run: pnpm authoring:contracts:check

      - name: 验证两个核心 Skill 与独立分发
        run: pnpm skills:check

      - name: 打包并回验独立 local-authoring Skill
        run: pnpm skills:pack --output "$RUNNER_TEMP/metriccanvas-local-authoring.tar.gz"

      - name: 上传独立 Skill 及发布回执
        uses: actions/upload-artifact@v4
        with:
          name: metriccanvas-local-authoring-${{ github.sha }}
          path: |
            ${{ runner.temp }}/metriccanvas-local-authoring.tar.gz
            ${{ runner.temp }}/metriccanvas-local-authoring.tar.gz.release.json

      - name: 下载并校验实际分发 Skill
        uses: actions/download-artifact@v4
        with:
          name: metriccanvas-local-authoring-${{ github.sha }}
          path: ${{ runner.temp }}/skill-downloaded

      - name: 仓外验证下载归档与整目录摘要
        run: python tools/scripts/skill-release.py verify --archive "$RUNNER_TEMP/skill-downloaded/metriccanvas-local-authoring.tar.gz"

      - name: 验证 MC 内容包、布局能力与旧页升级
        run: |
          pnpm mc:content:coverage
          pnpm mc:content:test
          pnpm test tests/mc-content-coverage.test.ts
          python tools/scripts/mc-content-fixtures.py --check
          python tools/scripts/mc-content-pack.py --output /tmp/mc-content.tar.gz

      - name: 上传已验证 MC 独立归档与来源记录
        uses: actions/upload-artifact@v4
        with:
          name: mc-content-${{ github.sha }}
          path: |
            /tmp/mc-content.tar.gz
            /tmp/mc-content.tar.gz.release.json

      - name: 验证创作接入与单向同步契约
        run: python -m unittest discover -s metriccanvas-authoring/test-harness/tests -p 'test_deployment*.py'

      - name: 上传创作 Bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: metriccanvas-authoring-${{ github.sha }}
          path: metriccanvas-authoring
          include-hidden-files: true

      - name: 下载创作 Bundle 验证实际分发文件
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          name: metriccanvas-authoring-${{ github.sha }}
          path: ${{ runner.temp }}/metriccanvas-authoring-installed

      - name: 校验下载后的创作 Bundle
        if: github.event_name == 'push'
        run: python "$RUNNER_TEMP/metriccanvas-authoring-installed/scripts/check_bundle.py"

  mc-distribution:
    needs: authoring
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装独立 MC 调用依赖
        run: python -m pip install -r metriccanvas-authoring/mc-content/scripts/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: mc-content-${{ github.sha }}
          path: ${{ runner.temp }}/mc-downloaded
      - name: 校验实际下载归档、来源与仓外能力
        run: python tools/scripts/mc-content-pack.py verify --archive "${{ runner.temp }}/mc-downloaded/mc-content.tar.gz"
      - name: 安装到独立版本目录
        run: python tools/scripts/mc-content-pack.py install --archive "${{ runner.temp }}/mc-downloaded/mc-content.tar.gz" --destination "${{ runner.temp }}/MC 中文 version"
      - name: 回归跨平台编码、缓存和错误诊断
        run: python -B -m unittest discover -s metriccanvas-authoring/test-harness/tests -p test_mc_distribution.py

  relay-release:
    runs-on: ubuntu-latest
    env:
      METRICCANVAS_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metriccanvas-authoring/tool/requirements.lock
      - name: 准备 MC 构建侧锁定环境
        run: python -m pip install --require-hashes -r metriccanvas-authoring/tool/requirements.lock
      - name: 构建共享产品包
        run: pnpm build:packages
      - name: 从实际产品真源生成四项
        run: pnpm relay:build --output "${{ runner.temp }}/relay-reference"
      - name: 验证四项发行回归（包含原42场景）
        run: pnpm relay:test
      - name: 验证核心 Python 同源回归
        run: pnpm relay:core:test
      - name: 首次基线不能绕过旧 current 的迁移门禁
        env:
          METRICCANVAS_RELAY_CANDIDATE: ${{ runner.temp }}/relay-reference
        run: python -B -m unittest discover -s tools/relay-reference -p test_adoption.py
      - name: 冻结消费者回放并打包完整四项及来源回执
        run: pnpm relay:pack --candidate "${{ runner.temp }}/relay-reference" --output "${{ runner.temp }}/metriccanvas-relay-reference.zip"
      - name: 上传四项归档及来源回执
        uses: actions/upload-artifact@v4
        with:
          name: relay-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/metriccanvas-relay-reference.zip
            ${{ runner.temp }}/metriccanvas-relay-reference.zip.release.json
      - name: 下载实际上传的四项归档
        uses: actions/download-artifact@v4
        with:
          name: relay-reference-${{ github.sha }}
          path: ${{ runner.temp }}/relay-downloaded
      - name: 验证下载字节、来源与隔离产品运行
        run: pnpm relay:verify --archive "${{ runner.temp }}/relay-downloaded/metriccanvas-relay-reference.zip" --expected-source "${{ github.sha }}" --probe

  relay-distribution:
    needs: relay-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 保留冻结消费样本的原始字节
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 首次准备六个精确运行依赖（不安装本仓 wheel）
        run: python -m pip install -r tools/relay-reference/runtime-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: relay-reference-${{ github.sha }}
          path: ${{ runner.temp }}/relay-native
      - name: 原生校验实际归档、正式与历史冻结调用、自检及失败边界
        run: python -I -B tools/relay-reference/package_cli.py verify --archive "${{ runner.temp }}/relay-native/metriccanvas-relay-reference.zip" --expected-source "${{ github.sha }}" --probe
      - name: 回归原生归档安全与拒绝覆盖
        run: python -B -m unittest discover -s tools/relay-reference -p test_archive.py
      - name: 解压到新的原生门禁测试目录（不激活）
        run: python -I -S -B tools/relay-reference/package_cli.py extract --archive "${{ runner.temp }}/relay-native/metriccanvas-relay-reference.zip" --destination "${{ runner.temp }}/relay-native-current-test"
      - name: 原生验证历史失败入回执且 current 迁移仍拒绝
        env:
          METRICCANVAS_RELAY_CANDIDATE: ${{ runner.temp }}/relay-native-current-test
        run: python -B -m unittest discover -s tools/relay-reference -p test_adoption.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metriccanvas-authoring/tool/requirements.lock
      - name: 安装契约注册探查依赖
        run: python -m pip install --require-hashes -r metriccanvas-authoring/tool/requirements.lock
      - run: pnpm test --maxWorkers=2

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      # 产品构建包含四个引擎交付物与纯前端静态平台。
      - name: 产品构建
        run: pnpm build

      - name: 严格校验 Embed 分发基线（每个 JS 原始体积不超过 1 MB）
        run: pnpm --filter @metriccanvas/embed check:dist

      - name: 构建平台生产与调试微前端归档
        run: pnpm --filter platform pack:microfrontend:all

      - name: 安装调试包验收浏览器
        run: pnpm --filter @metriccanvas/embed exec playwright install --with-deps chromium

      - name: 安装 MC 产品回放浏览器
        run: pnpm --filter playground exec playwright install --with-deps chrome

      - name: 回放 MC 内容诊断、Report 与旧页迁移场景
        run: |
          pnpm --filter playground exec svelte-kit sync
          pnpm --filter playground exec playwright test mc-content.browser.ts --workers=1

      - name: 验证 qiankun 调试包源码映射
        run: node apps/platform/tests/microfrontend/debug-browser.mjs

      - name: 验证盘古部署配置兼容迁移
        run: |
          pnpm --filter platform test:pangu-deployment
          MICROFRONTEND_PROFILE=debug pnpm --filter platform test:pangu-deployment

      - name: 检查打包入口、声明与组件
        run: pnpm packages:check

      - name: 验证取数包Node独立安装与CLI
        run: node tools/package-build/data-execution-consumer.mjs

      - name: 上传静态平台
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: metriccanvas-platform-static-${{ github.sha }}
          path: apps/platform/build

      - name: 上传平台 HTML 微前端
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: metriccanvas-platform-microfrontend-${{ github.sha }}
          path: apps/platform/dist

  embed-distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: 验证原生与混合模块路径的分包归属
        run: pnpm test tests/embed-chunking.test.ts
      - name: 原生构建 Embed 并严格检查每个 JS 不超过 1 MB
        run: pnpm --filter @metriccanvas/embed build
      - name: 安装 Embed 接入回归浏览器
        run: pnpm --filter @metriccanvas/embed exec playwright install --with-deps chrome
      - name: 验证完整复制、ES/global 与 Webpack 5 接入
        run: pnpm --filter @metriccanvas/embed exec playwright test distribution.spec.ts webpack-consumer.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: metriccanvas-embed-${{ matrix.os }}-${{ github.sha }}
          path: packages/embed/dist

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Install supported browser channels
        run: pnpm --filter @metriccanvas/embed exec playwright install --with-deps chrome msedge
      - name: Verify isolated source and installed consumers
        run: pnpm compatibility:check --svelte=current --source-checks=ci
        env:
          METRICCANVAS_COMPATIBILITY_DIR: ${{ runner.temp }}/metriccanvas-compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-current-${{ github.sha }}
          path: |
            ${{ runner.temp }}/metriccanvas-compatibility/summary.json
            ${{ runner.temp }}/metriccanvas-compatibility/*/*.tgz
            ${{ runner.temp }}/metriccanvas-compatibility/*/logs/**
            ${{ runner.temp }}/metriccanvas-compatibility/*/page-only/package*.json
            ${{ runner.temp }}/metriccanvas-compatibility/*/ui-only/package*.json
            ${{ runner.temp }}/metriccanvas-compatibility/*/consumer/package*.json
            ${{ runner.temp }}/metriccanvas-compatibility/*/consumer/browser-*.json
            ${{ runner.temp }}/metriccanvas-compatibility/*/ui-only/test-results/**
            ${{ runner.temp }}/metriccanvas-compatibility/*/consumer/test-results/**
            ${{ runner.temp }}/metriccanvas-compatibility/*/consumer/playwright-report/**

  ci:
    if: ${{ always() }}
    needs: [authoring, mc-distribution, relay-release, relay-distribution, tests, types, build, compatibility, embed-distribution]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require all checks to succeed
        run: node tools/scripts/check-ci-results.mjs
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
