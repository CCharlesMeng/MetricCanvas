name: Setup locked workspace
description: Install the repository's pinned Node and pnpm workspace.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
